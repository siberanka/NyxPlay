apply plugin: 'com.android.application'

android {
    ndkVersion "28.2.13676358"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        // NyxPlay calendar versioning: YYYY.MM.DD.BUILD, versionCode = YYYYMMDDBB
        versionName "2026.11.20.1"
        versionCode = 2026112001

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.siberanka.nyxplay.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://github.com/siberanka/NyxPlay/releases"

            applicationId "com.siberanka.nyxplay"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
            // The three Bouncy Castle jars (1.87) ship the same MIT licence text at this path.
            pickFirsts.add('META-INF/LICENSE.md')
        }
    }

    // Release signing is optional. android/keystore.properties (git-ignored) holds either the four
    // keys storeFile, storePassword, keyAlias, keyPassword, or a single propertiesFile=<path> entry
    // pointing at such a file kept outside the repository. NYXPLAY_KEYSTORE_PROPERTIES may name the
    // file instead. Without any of them the release build stays unsigned.
    def signingProps = new Properties()
    def signingSource = System.getenv('NYXPLAY_KEYSTORE_PROPERTIES')
    def localSigning = rootProject.file('keystore.properties')
    if (!signingSource && localSigning.exists()) {
        def local = new Properties()
        localSigning.withInputStream { local.load(it) }
        signingSource = local.getProperty('propertiesFile')
        if (!signingSource) {
            signingProps.putAll(local)
        }
    }
    if (signingSource && file(signingSource).exists()) {
        file(signingSource).withInputStream { signingProps.load(it) }
    }
    def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { signingProps.getProperty(it) }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // Local update-test server (e.g. -PupdateTestBase=http://10.0.2.2:8765); never set for release builds
            buildConfigField "String", "UPDATE_TEST_BASE", "\"${project.findProperty('updateTestBase') ?: ''}\""
            resValue "string", "app_label", "NyxPlay Debug"
            resValue "string", "app_label_root", "NyxPlay Debug (Root)"
            resValue "string", "app_label_game", "NyxPlay Debug"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // NyxPlay uses its own application ID (com.siberanka.nyxplay), so it can be installed
            // side by side with Moonlight and Artemis.
            buildConfigField "String", "UPDATE_TEST_BASE", "\"\""
            resValue "string", "app_label", "NyxPlay"
            resValue "string", "app_label_root", "NyxPlay (Root)"
            resValue "string", "app_label_game", "NyxPlay"

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric decodes large drawables into AWT images; the default worker heap runs out late in the suite
            maxHeapSize = '2g'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.87'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // SearchPreference pulls in commons-text 1.3, which resolves to an affected commons-lang3 (CVE-2025-48924).
    constraints {
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'fixes CVE-2025-48924 in the version required by commons-text 1.3'
        }
    }

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
