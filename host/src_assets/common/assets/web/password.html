<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
  <style>
    .config-page {
      padding: 1em;
      border: 1px solid #dee2e6;
      border-top: none;
    }

    .buttons {
      padding: 1em 0;
    }
  </style>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <div class="container">
    <h1 class="my-4">{{ $t('password.password_change') }}</h1>
    <form @submit.prevent="save">
      <div class="card d-flex p-4 flex-row">
        <div class="col-md-6 px-4">
          <h4>{{ $t('password.current_creds') }}</h4>
          <div class="mb-3">
            <label for="currentUsername" class="form-label">{{ $t('_common.username') }}</label>
            <input required type="text" class="form-control" id="currentUsername"
              v-model="passwordData.currentUsername" />
            <div class="form-text">&nbsp;</div>
          </div>
          <div class="mb-3">
            <label for="currentPassword" class="form-label">{{ $t('_common.password') }}</label>
            <input autocomplete="current-password" type="password" class="form-control" id="currentPassword"
              v-model="passwordData.currentPassword" />
          </div>
        </div>
        <div class="col-md-6 px-4">
          <h4>{{ $t('password.new_creds') }}</h4>
          <div class="mb-3">
            <label for="newUsername" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="newUsername" v-model="passwordData.newUsername" />
            <div class="form-text">{{ $t('password.new_username_desc') }}</div>
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">{{ $t('_common.password') }}</label>
            <input autocomplete="new-password" required type="password" class="form-control" id="newPassword"
              v-model="passwordData.newPassword" />
          </div>
          <div class="mb-3">
            <label for="confirmNewPassword" class="form-label">{{ $t('password.confirm_password') }}</label>
            <input autocomplete="new-password" required type="password" class="form-control" id="confirmNewPassword"
              v-model="passwordData.confirmNewPassword" />
          </div>
        </div>
      </div>
      <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
      <div class="alert alert-success" v-if="success">
        <b>{{ $t('_common.success') }}</b> {{ $t('password.success_msg') }}
      </div>
      <div class="mb-3 buttons">
        <button class="btn btn-primary" :disabled="loading">{{ $t('_common.save') }}</button>
      </div>
    </form>
  </div>
</body>
<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'

  const app = createApp({
    components: {
      Navbar
    },
    data() {
      return {
        error: null,
        success: false,
        loading: false,
        passwordData: {
          currentUsername: "",
          currentPassword: "",
          newUsername: "",
          newPassword: "",
          confirmNewPassword: "",
        },
      };
    },
    methods: {
      save() {
        if (this.passwordData.newPassword !== this.passwordData.confirmNewPassword) {
          this.error = this.$t('password.err_mismatch');
          return;
        };
        if (this.passwordData.newPassword.length < 8) {
          this.error = this.$t('password.err_too_short');
          return;
        };
        this.error = null;
        this.loading = true;
        fetch("./api/password", {
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((r) => {
          return r.json().catch(() => ({})).then((rj) => {
            if (r.status === 200 && rj.status === true) {
              this.success = true;
              setTimeout(() => {
                document.location.reload();
              }, 5000);
            } else {
              this.error = this.describeError(rj && rj.error, r.status);
            }
          });
        }).catch(() => {
          this.loading = false;
          this.error = this.$t('password.err_network');
        });
      },
      describeError(message, status) {
        const keys = {
          'Invalid Current Credentials': 'password.err_invalid_current',
          'Password Mismatch': 'password.err_mismatch',
          'Invalid Username': 'password.err_invalid_username',
          'Password Too Short': 'password.err_too_short',
          'Could not save the credentials': 'password.err_save_failed',
          'Cross-origin request rejected': 'password.err_cross_origin',
        };
        if (keys[message]) {
          return this.$t(keys[message]);
        }
        return message || this.$t('password.err_server', { status });
      },
    },
  });

  initApp(app);
</script>
